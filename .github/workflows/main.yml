name: CI / CD

# Every push builds the plugins and tests each package, and a v tag then publishes them.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  plugins:
    name: Plugins
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build and test
        run: make wasm && cargo test --manifest-path rust/Cargo.toml

      # Built once, so the packages are tested and published with the same plugins.
      - uses: actions/upload-artifact@v7
        with:
          name: plugins
          path: edge/*/*.wasm

  packages:
    name: Packages
    needs: [plugins]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: plugins
          path: edge

      # The runner image is not a contract, so the browser --web drives is installed.
      - uses: browser-actions/setup-chrome@v2
        id: chrome

      # Always the newest CLI, since a package is only as current as the engine it is tested on.
      - name: Install edge
        run: |
          curl -fsSL https://cdn.edgepython.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test each package natively and in a browser
        env:
          EDGE_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          for dir in edge/*/; do
            cd "$dir"
            edge lock
            edge test
            edge test --web
            cd "$GITHUB_WORKSPACE"
          done

  publish:
    name: Publish
    needs: [packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    # A reviewer approves here, once every package has passed its tests.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: plugins
          path: edge

      - name: Install edge
        run: |
          curl -fsSL https://cdn.edgepython.com/cli/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # tsort lays each package after the std packages it imports, so a dependency is published before what needs it.
      - name: Publish each package
        env:
          EDGE_TOKEN: ${{ secrets.EDGE_TOKEN }}
        run: |
          order=$(for dir in edge/*/; do
            pkg=$(basename "$dir")
            echo "$pkg $pkg"
            jq -r --arg pkg "$pkg" '.imports | to_entries[] | select(.value | test("^[0-9]")) | "\(.key) \($pkg)"' "$dir/edge.json"
          done | tsort)
          for pkg in $order; do
            [ -d "edge/$pkg" ] || continue
            cd "edge/$pkg"
            edge lock
            edge build
            # 2 is a version already published, so the packages after it still go.
            edge publish app.edge || [ $? -eq 2 ]
            cd "$GITHUB_WORKSPACE"
          done
